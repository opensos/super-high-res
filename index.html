---
layout: default
---
<ul id="posts">
  {% for post in paginator.posts %}
    {% include post.html post=post body=post.content %}
  {% endfor %}
</ul>

{% if paginator.next_page %}
<div id="load-more" data-next="{{ paginator.next_page_path | relative_url }}" aria-hidden="true" style="height: 1px"></div>
<p id="load-error" hidden><button type="button">Retry loading posts</button></p>
<script>
(() => {
  const posts = document.querySelector('#posts');
  const sentinel = document.querySelector('#load-more');
  const error = document.querySelector('#load-error');
  if (!('IntersectionObserver' in window)) return;

  const observer = new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting) loadNextPage();
  }, { rootMargin: '0px 0px 300px' });

  async function loadNextPage() {
    observer.unobserve(sentinel);
    error.hidden = true;

    try {
      const response = await fetch(sentinel.dataset.next, { cache: 'no-cache' });
      if (!response.ok) throw new Error('Could not load the next page');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const items = page.querySelectorAll('#posts > li');
      if (!items.length) throw new Error('No posts found');

      const following = page.querySelector('#load-more')?.dataset.next;
      posts.append(...items);
      if (following) {
        sentinel.dataset.next = new URL(following, response.url).href;
        observer.observe(sentinel);
      } else {
        sentinel.remove();
        error.remove();
      }
    } catch {
      error.hidden = false;
    }
  }

  error.querySelector('button').addEventListener('click', loadNextPage);
  observer.observe(sentinel);
})();
</script>
{% endif %}
